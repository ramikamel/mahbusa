name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Change to --frozen-lockfile once the initial lockfile is generated.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:engine
      - run: pnpm build
